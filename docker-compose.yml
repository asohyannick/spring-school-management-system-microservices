      - sms-network

  # ============================================================
  #  human-resource-service — PostgreSQL + Kafka + MinIO
  # ============================================================
  human-resource-service:
    build:
      context: ./human-resource-service
      dockerfile: Dockerfile
    container_name: sms-human-resource-service
    <<: *common-env
    ports:
      - "${HUMAN_RESOURCE_SERVICE_PORT}:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
