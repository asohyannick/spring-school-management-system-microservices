      - sms-network

  # ============================================================
  #  inventory-service — MySQL + Kafka + MinIO
  # ============================================================
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: sms-inventory-service
    <<: *common-env
    ports:
      - "${INVENTORY_SERVICE_PORT}:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
