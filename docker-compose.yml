      - sms-network

  # ============================================================
  #  review-service — MongoDB + Kafka + MinIO
  # ============================================================
  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    container_name: sms-review-service
    <<: *common-env
    ports:
      - "${REVIEW_SERVICE_PORT}:8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - sms-network

  # ============================================================
  #  staffprofile-service — MySQL + Kafka + MinIO
  # ============================================================
  staffprofile-service:
    build:
      context: ./staffProfile-service
      dockerfile: Dockerfile
    container_name: sms-staffprofile-service
    <<: *common-env
    ports:
      - "${STAFF_PROFILE_SERVICE_PORT}:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
