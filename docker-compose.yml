# ============================================================
#  Shared env file — applied to all app services
# ============================================================
x-common-env: &common-env
  env_file:
    - .env.properties

networks:
  sms-network:
    driver: bridge

volumes:
  postgres-data:
  mysql-data:
  mongodb-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  minio-data:
  grafana-data:

services:

  # ============================================================
  #  PostgreSQL
  #  Serves: auth-service, admission-service,
  #          payment-service, human-resource-service
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: sms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  #  MySQL
  #  Serves: course-service, assignment-service, quiz-service,
  #          inventory-service, staffprofile-service,
  #          studentprofile-service, attendance-service
  # ============================================================
  mysql:
    image: mysql:8.3
    container_name: sms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${COURSE_MYSQL_DB}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  #  MongoDB
  #  Serves: review-service
  # ============================================================
  mongodb:
    image: mongo:7-jammy
    container_name: sms-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  #  Redis — API Gateway rate limiting
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: sms-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  #  Zookeeper
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: sms-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "${ZOOKEEPER_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  #  Kafka
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sms-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:${KAFKA_PORT}"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================
  #  MinIO — S3-compatible object storage
  #  Console UI: http://localhost:9001
  #  API:        http://localhost:9000
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: sms-minio
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================
  #  Discovery Server — starts first
  # ============================================================
  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: sms-discovery-server
    <<: *common-env
    ports:
      - "${DISCOVERY_SERVER_PORT}:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://${EUREKA_USER}:${EUREKA_PASSWORD}@localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8

  # ============================================================
  #  Config Server — starts after discovery + kafka
  # ============================================================
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: sms-config-server
    <<: *common-env
    ports:
      - "${CONFIG_SERVER_PORT}:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      SERVER_PORT: 8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      API_VERSION: ${API_VERSION}
    depends_on:
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8

  # ============================================================
  #  API Gateway
  # ============================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: sms-api-gateway
    <<: *common-env
    ports:
      - "${API_GATEWAY_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8

  # ============================================================
  #  auth-service — PostgreSQL + Kafka
  # ============================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: sms-auth-service
    <<: *common-env
    ports:
      - "${AUTH_SERVICE_PORT}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sms-network

  # ============================================================
  #  admission-service — PostgreSQL + Kafka
  # ============================================================
  admission-service:
    build:
      context: ./admission-service
      dockerfile: Dockerfile
    container_name: sms-admission-service
    <<: *common-env
    ports:
      - "${ADMISSION_SERVICE_PORT}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - sms-network

  # ============================================================
  #  course-service — MySQL + Kafka
  # ============================================================
  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    container_name: sms-course-service
    <<: *common-env
    ports:
      - "${COURSE_SERVICE_PORT}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - sms-network

  # ============================================================
  #  assignment-service — MySQL + Kafka
  # ============================================================
  assignment-service:
    build:
      context: ./assignment-service
      dockerfile: Dockerfile
    container_name: sms-assignment-service
    <<: *common-env
    ports:
      - "${ASSIGNMENT_SERVICE_PORT}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sms-network

  # ============================================================
  #  payment-service — PostgreSQL + Kafka
  # ============================================================
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: sms-payment-service
    <<: *common-env
    ports:
      - "${PAYMENT_SERVICE_PORT}:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sms-network

  # ============================================================
  #  quiz-service — MySQL + Kafka + MinIO
  # ============================================================
  quiz-service:
    build:
      context: ./quiz-service
      dockerfile: Dockerfile
    container_name: sms-quiz-service
    <<: *common-env
    ports:
      - "${QUIZ_SERVICE_PORT}:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
